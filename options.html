<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chatbot Side Panel for Dify</title>
    <style>
      body { margin: 2rem; font-family: sans-serif; max-width: 40rem; }
      input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { margin-top: 0.75rem; padding: 0.5rem 1rem; }
      #status { margin-left: 0.75rem; }
    </style>
  </head>
  <body>
    <h1>Chatbot Side Panel for Dify</h1>
    <label for="chatbot-url">ChatBot URL</label>
    <p>In Dify, open the app's <b>Embed</b> dialog, choose the Chrome extension, and copy the ChatBot URL.</p>
    <input id="chatbot-url" type="url" placeholder="https://<dify-host>/agent/<token> or /chatbot/<token>" />
    <button id="save">Save</button><span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
